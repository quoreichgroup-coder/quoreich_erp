# Maven Wrapper — le poste et la CI n'installent pas Maven globalement.
#
# Le plan de bascule (§2) épingle Maven 3.10.0. `distributionType=only-script`
# signifie que `mvnw` télécharge et déploie lui-même la distribution, sans jar
# de wrapper versionné : le dépôt ne contient que les deux scripts.
wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.10.0/apache-maven-3.10.0-bin.zip

# Épingle d'intégrité : sans cette ligne, `only-script` déploie l'archive sans
# vérifier son empreinte. La valeur ci-dessous est le SHA-256 de
# `apache-maven-3.10.0-bin.zip`, elle-même authentifiée par le SHA-512 publié
# par Maven Central :
#   22d31676d5b92ed53308c19ecded3245d0efd0cddfec51ec7bab62f4f13ad70d
#   dddceff8e62940e0e8e2421f3cde8106737f4becec0aa034ffeff2a754e88337
