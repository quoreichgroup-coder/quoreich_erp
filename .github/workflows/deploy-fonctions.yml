# Déploiement des fonctions edge Supabase, à la demande seulement.
#
# Les fonctions ne partent jamais automatiquement : certaines exigent des secrets (SMTP, hôte de rendu PDF,
# fournisseur d'IA) qui doivent être posés dans le projet AVANT leur mise en service. On choisit la cible et la
# liste des fonctions ; chaque fonction garde sa configuration de `supabase/config.toml` (verify_jwt…).
#
# Secrets de l'environnement GitHub choisi (supabase-staging ou supabase-production) :
#   SUPABASE_ACCESS_TOKEN  jeton personnel Supabase (Account → Access Tokens), droit sur le projet ;
#   SUPABASE_PROJECT_REF   référence du projet (ex. ymomubgdhufwtbsqqnas pour la production actuelle).

name: Déploiement des fonctions edge

on:
  workflow_dispatch:
    inputs:
      cible:
        description: "Projet Supabase"
        type: choice
        options: [staging, production]
        default: staging
      fonctions:
        description: "Fonctions séparées par des espaces (ex. bceao-rates ar-dunning)"
        type: string
        required: true

concurrency:
  group: deploy-fonctions-${{ inputs.cible }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # Version épinglée du CLI Supabase (npm « supabase », vérifiée le 26/11/2026).
  SUPABASE_CLI_VERSION: "3.4.0"

jobs:
  deploy:
    name: Fonctions (${{ inputs.cible }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: supabase-${{ inputs.cible }}
    steps:
      - name: Récupération du dépôt
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fonctions connues du dépôt
        env:
          FONCTIONS: ${{ inputs.fonctions }}
        run: |
          for f in $FONCTIONS; do
            case "$f" in
              _shared|*[!a-z0-9-]*) echo "::error::Nom de fonction refusé : $f"; exit 1 ;;
            esac
            test -f "supabase/functions/$f/index.ts" || { echo "::error::Fonction inconnue : $f"; exit 1; }
          done

      - name: Déploiement
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          FONCTIONS: ${{ inputs.fonctions }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ]; then
            echo "::error::Secrets SUPABASE_ACCESS_TOKEN / SUPABASE_PROJECT_REF absents de l'environnement supabase-${{ inputs.cible }}."
            exit 1
          fi
          for f in $FONCTIONS; do
            npx --yes "supabase@${SUPABASE_CLI_VERSION}" functions deploy "$f" --project-ref "$SUPABASE_PROJECT_REF"
            echo "Fonction déployée : $f" >> "$GITHUB_STEP_SUMMARY"
          done
