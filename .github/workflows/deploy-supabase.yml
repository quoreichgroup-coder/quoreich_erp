# Automatic migrations are staging only. Production is manual, independent-review
# protected and refused before environment access if protection metadata is absent.
name: Déploiement Supabase

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      cible:
        description: "Projet Supabase à mettre à jour"
        type: choice
        options: [staging, production]
        default: staging
      dry_run:
        description: "Lister les migrations en attente sans les appliquer"
        type: boolean
        default: true


permissions:
  contents: read

jobs:
  authorize:
    if: >-
      github.repository == 'quoreichgroup-coder/quoreich_erp' &&
      ((github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_repository.id == github.repository_id) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      (inputs.cible == 'staging' || inputs.cible == 'production')))
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/authorize.yml
    with:
      mode: deploy
      target: ${{ inputs.cible || 'staging' }}

  deploy:
    name: Migrations Supabase (${{ inputs.cible || 'staging' }})
    needs: authorize
    if: needs.authorize.result == 'success' && needs.authorize.outputs.attempt == github.run_attempt
    concurrency:
      group: deploy-supabase-${{ inputs.cible || 'staging' }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: supabase-${{ inputs.cible || 'staging' }}
    env:
      PGCLIENTENCODING: UTF8
    steps:
      - name: Secret présent
        id: secret
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          CIBLE: ${{ inputs.cible || 'staging' }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          elif [ "$CIBLE" = "production" ]; then
            echo "::error::Secret SUPABASE_DB_URL absent de supabase-production."
            exit 1
          else
            echo "::warning::Recette non configurée : déploiement ignoré."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupération du commit autorisé
        if: steps.secret.outputs.ok == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.sha }}
          persist-credentials: false

      - name: Client PostgreSQL
        if: steps.secret.outputs.ok == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null && psql --version

      - name: Migrations en attente
        if: steps.secret.outputs.ok == 'true'
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -o pipefail
          bash scripts/schema/deploy-supabase.sh --dry-run | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Application
        if: steps.secret.outputs.ok == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry_run != true)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: bash scripts/schema/deploy-supabase.sh
